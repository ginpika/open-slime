<div id="trail-app" aria-label="个人待办内容区设计预览">
  <div class="tr-shell">
    <section class="tr-main">
      <div class="tr-content">
        <header class="tr-pagehead"><div><div class="tr-page-title"><h1 id="tr-heading">待办</h1><span class="tr-preview-label">示例数据</span></div><p id="tr-subheading">10 月 16 日，星期五</p></div><div id="tr-header-action"></div></header>
        <div class="tr-tabs" role="tablist" aria-label="待办视图">
          <button type="button" role="tab" id="tr-tab-today" data-view="today" aria-selected="true" aria-controls="tr-page">今天<span class="tr-tab-count" id="tr-today-count">3</span></button>

    </section>
  </div>

  <div id="tr-toast" class="tr-toast" role="status" hidden></div>
</div>
<script>
(()=>{
const root=document.getElementById('trail-app');
const $=s=>root.querySelector(s);
const TODAY='2026-10-16';
const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[
{id:'design',title:'设计个人待办模块',tag:'Minis',state:'doing',plan:TODAY,created:'2026-10-15',first:TODAY,note:'主语是我。项目只是标签，今天的精力和过去的经历同样重要。',events:[['2026-10-15','记下想法'],[TODAY,'安排到今天'],[TODAY,'第一次开始投入']]},
{id:'memory',title:'验证跨会话记忆的隔离边界',tag:'Minis',state:'doing',plan:TODAY,created:'2026-10-14',first:TODAY,note:'重点检查同项目不同 Agent、切换项目和撤销续接后的行为。',events:[['2026-10-14','记下事项'],[TODAY,'安排到今天'],[TODAY,'第一次开始投入']]},
{id:'web',title:'修好网页快照的长文阅读',tag:'Minis',state:'done',plan:TODAY,created:'2026-10-13',first:'2026-10-15',completed:TODAY,note:'长文章终于可以完整读下去，来源也能追溯了。',events:[['2026-10-13','记下想法'],['2026-10-15','第一次开始投入'],[TODAY,'完成 · 验证长文与来源链接']]},
{id:'walk',title:'傍晚去河边走走',tag:'生活',state:'ready',plan:TODAY,created:TODAY,note:'不用带着待办清单去散步。',events:[[TODAY,'记下事项']]},
{id:'search',title:'给对话加一个好用的搜索',tag:'Minis',state:'ready',plan:'2026-10-19',created:'2026-10-12',note:'先从按关键词找到旧对话开始。',events:[['2026-10-12','记下想法']]},
{id:'voice',title:'试试用语音收集一闪而过的想法',tag:'Minis',state:'idea',created:'2026-10-15',note:'走路的时候常有想法，不想每次都停下来打字。',events:[['2026-10-15','记下想法']]},
{id:'read',title:'读完《设计中的设计》的这一章',tag:'学习',state:'idea',created:'2026-10-11',note:'读到有感触的地方，留一句自己的话。',events:[['2026-10-11','记下想法']]},
{id:'terminal',title:'让助手里的终端真正可用',tag:'Minis',state:'done',created:'2026-10-04',first:'2026-10-06',completed:'2026-10-12',note:'第一次在自己的助手里，把一个修改从想法推进到运行。',events:[['2026-10-04','记下想法'],['2026-10-06','第一次开始投入'],['2026-10-12','完成 · 可以在助手里直接运行代码']]},
{id:'book',title:'写下关于注意力的读书笔记',tag:'学习',state:'done',created:'2026-10-07',first:'2026-10-08',completed:'2026-10-08',note:'把注意力放在哪里，日子就会长成什么样。',events:[['2026-10-07','记下想法'],['2026-10-08','完成 · 留下了一页笔记']]},
{id:'photo',title:'整理秋天第一次徒步的照片',tag:'生活',state:'done',created:'2026-10-02',first:'2026-10-03',completed:'2026-10-03',note:'山风、热茶，还有在路上聊了很久的那个下午。',events:[['2026-10-02','记下事项'],['2026-10-03','完成 · 留住那个下午']]},
{id:'first',title:'做出助手的第一个可用版本',tag:'Minis',state:'done',created:'2026-09-12',first:'2026-09-12',completed:'2026-09-29',note:'从空白页面开始，终于有了一个每天愿意打开的地方。',events:[['2026-09-12','记下想法'],['2026-09-12','第一次开始投入'],['2026-09-29','完成 · 第一个可用版本']]},
{id:'complex',title:'尝试自动给每件事评优先级',tag:'Minis',state:'dropped',created:'2026-10-05',first:'2026-10-06',closed:'2026-10-09',note:'试过之后决定放下。比起更多评分，我更需要自己做选择。',events:[['2026-10-05','记下想法'],['2026-10-06','第一次开始投入'],['2026-10-09','放下 · 暂时用不上复杂评分']]}
];
let logs=[
{id:1,task:'web',date:TODAY,start:'09:20',end:'10:35',seconds:4500,note:'验证快照长文与来源链接'},
{id:2,task:'memory',date:TODAY,start:'10:50',end:'11:30',seconds:2400,note:'补齐边界场景'},
{id:3,task:'terminal',date:'2026-10-12',start:'09:00',end:'11:00',seconds:7200},
{id:4,task:'terminal',date:'2026-10-06',start:'14:00',end:'16:30',seconds:9000},
{id:5,task:'book',date:'2026-10-08',start:'20:00',end:'20:45',seconds:2700},
{id:6,task:'photo',date:'2026-10-03',start:'16:00',end:'17:00',seconds:3600},
{id:7,task:'complex',date:'2026-10-06',start:'19:00',end:'19:30',seconds:1800},
{id:8,task:'first',date:'2026-09-29',start:'09:00',end:'11:30',seconds:9000},
{id:9,task:'web',date:'2026-10-15',start:'14:00',end:'15:00',seconds:3600}
];
let active={task:'design',began:Date.now()-25*60000,date:TODAY,label:'14:00'};
let view='today',filter='全部',month='2026-10',daynote='今天把一个模糊的想法，变成了可以讨论的设计。',detail=null,toastTimer;
const find=id=>tasks.find(t=>t.id===id);
const open=t=>!['done','dropped'].includes(t.state);
const eligible=t=>filter==='全部'||(filter==='未分类'?!t.tag:t.tag===filter);
const fmt=s=>{let m=Math.floor(s/60);return m>=60?`${Math.floor(m/60)} 小时${m%60?' '+m%60+' 分':''}`:m?m+' 分钟':Math.floor(s)+' 秒';};
const minutes=s=>Math.floor(s/60)+' 分钟';
const seconds=()=>active?Math.max(0,Math.floor((Date.now()-active.began)/1000)):0;
const timeLabel=()=>{const m=14*60+25+Math.floor((Date.now()-loadedAt)/60000);return `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;};
const loadedAt=Date.now();
function allLogs(){const list=active?[...logs,{id:'active',task:active.task,date:active.date,start:active.label,end:'进行中',seconds:seconds()}]:[...logs];return list.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));}
const taskSeconds=id=>allLogs().filter(l=>l.task===id).reduce((s,l)=>s+l.seconds,0);
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.8}});}
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{view,projectFilter:filter,month},privateContent:{view,filter,month}}).catch(()=>{});}
function applySaved(saved){const s=saved?.privateContent;if(s){if(['today','todos','review'].includes(s.view))view=s.view;if(['全部','Minis','生活','学习','未分类'].includes(s.filter))filter=s.filter;if(['2026-09','2026-10'].includes(s.month))month=s.month;}}
applySaved(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>{applySaved(e.detail?.globals?.widgetState);render();});
function toast(text){clearTimeout(toastTimer);$('#tr-toast').textContent=text;$('#tr-toast').hidden=false;toastTimer=setTimeout(()=>$('#tr-toast').hidden=true,3200);}
function tag(t){return t.tag?`<span class="tr-label">${esc(t.tag)}</span>`:'';}
function row(t,mode='normal'){
 const done=t.state==='done',running=active?.task===t.id,used=taskSeconds(t.id);
 const status=running?'正在投入':t.state==='idea'?'还没安排':t.state==='dropped'?'已放下':done?'已完成':t.plan&&t.plan>TODAY?'计划 '+t.plan.slice(5).replace('-',' / '):t.first?'已经开始':'尚未开始';
 const schedule=(mode==='idea'||mode==='later')&&t.plan!==TODAY;
 const action=done?'查看':running?'暂停':schedule?'今天做':'开始';
 return `<article class="tr-row ${done?'is-done':''}"><button type="button" class="tr-check" data-action="complete" data-id="${t.id}" aria-label="${done?'重新打开':'完成'}：${esc(t.title)}" aria-pressed="${done}"><span class="tr-check-circle">${done?icon('check'):''}</span></button><div><button type="button" class="tr-title-button" data-action="detail" data-id="${t.id}">${esc(t.title)}</button><div class="tr-row-meta">${tag(t)}<span>${status}</span>${used?`<span>· ${fmt(used)}</span>`:''}</div></div><button type="button" class="tr-row-action ${running?'is-on':''}" data-action="${done?'detail':running?'pause':schedule?'plan':'start'}" data-id="${t.id}">${action}</button></article>`;
}
function capture(){return `<form id="tr-capture-form" class="tr-capture">${icon('plus')}<label class="tr-hidden-label" for="tr-capture-input">记下一个新想法</label><input id="tr-capture-input" maxlength="160" placeholder="有什么想做的？先记下来。" autocomplete="off" required><button type="submit">记下</button></form>`;}
function group(title,list,mode='normal',empty=''){return `<section><div class="tr-sectionhead"><h2>${title}<small>${list.length}</small></h2></div>${list.length?list.map(t=>row(t,mode)).join(''):`<p class="tr-empty">${empty||'这里暂时没有事项。'}</p>`}</section>`;}
function todayRight(){
 const daily=allLogs().filter(l=>l.date===TODAY&&eligible(find(l.task))),total=daily.reduce((s,l)=>s+l.seconds,0),map=new Map();daily.forEach(l=>map.set(l.task,(map.get(l.task)||0)+l.seconds));const parts=[...map];
 return `<aside class="tr-right"><section class="tr-focus"><div class="tr-eyebrow"><span class="tr-dot"></span>${active?'此刻，专注一件事':'留一点专注给自己'}</div><h3>${active?esc(find(active.task).title):'准备好，再开始'}</h3><div class="tr-clock" id="tr-clock">${clock()}</div><button type="button" class="tr-button" data-action="${active?'pause':'pick'}">${icon(active?'pause':'play')}${active?'暂停，记下这一段':'选择一件事'}</button></section><section><div class="tr-right-head"><h2>精力去向</h2><button type="button" class="tr-button tr-quiet" data-action="log">补记</button></div><div class="tr-time-total" id="tr-day-total">${fmt(total)}</div><small>${filter==='全部'?'今天已记录的投入':'当前标签下的投入'}</small><div class="tr-stack" aria-label="今天的任务投入分配">${parts.map(([id,s])=>`<span style="flex:${s}" aria-label="${esc(find(id).title)} ${fmt(s)}"></span>`).join('')}</div>${parts.map(([id,s],i)=>`<div class="tr-allocation"><span class="tr-swatch" style="${i===1?'background:var(--p-light)':i===2?'background:var(--p-warm-ink)':''}"></span><span>${esc(find(id).title)}</span><span>${minutes(s)}</span></div>`).join('')||'<p class="tr-empty">还没有记录，随时可以开始。</p>'}<div class="tr-timeline">${daily.map(l=>`<div class="tr-log"><small>${esc(l.start)} — ${esc(l.end)}${l.id==='active'?' · 计时中':''}</small><p>${esc(find(l.task).title)}</p><small>${l.note?esc(l.note):fmt(l.seconds)}</small></div>`).join('')}</div></section><section class="tr-daynote"><h3>给今天留一句话</h3><label class="tr-hidden-label" for="tr-note">今日回顾</label><textarea id="tr-note" placeholder="今天有什么值得记住？">${esc(daynote)}</textarea><small id="tr-note-status">只需一句，也可以留白。</small></section></aside>`;
}
function clock(){const s=seconds();return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function render(){
 const review=view==='review';
 $('#tr-subheading').textContent=review?'那些认真度过的日子，都有迹可循。':view==='todos'?'想做的事，慢慢变成做过的事。':'10 月 16 日，星期五';
 $('#tr-header-action').innerHTML=review?`<div class="tr-month-picker"><button type="button" class="tr-iconbutton" data-action="month-prev" aria-label="上一个月" ${month==='2026-09'?'disabled':''}>${icon('chevron-left')}</button><span>${month==='2026-10'?'2026 年 10 月':'2026 年 9 月'}</span><button type="button" class="tr-iconbutton" data-action="month-next" aria-label="下一个月" ${month==='2026-10'?'disabled':''}>${icon('chevron-right')}</button></div>`:`<button type="button" class="tr-button tr-primary" data-action="new">${icon('plus')}记一件事</button>`;
 root.querySelectorAll('.tr-tabs [data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));
 $('#tr-page').setAttribute('aria-labelledby','tr-tab-'+view);
 $('#tr-today-count').textContent=tasks.filter(t=>open(t)&&t.plan===TODAY).length;$('#tr-open-count').textContent=tasks.filter(open).length;
 $('#tr-filters').innerHTML=`<span class="tr-tag-label">项目标签</span>${['全部','Minis','生活','学习',...(tasks.some(t=>!t.tag)?['未分类']:[])].map(name=>`<button type="button" class="tr-chip" data-filter="${name}" aria-pressed="${filter===name}">${name==='全部'?'全部事项':esc(name)}</button>`).join('')}`;
 if(review){renderReview();icons();return;}
 const ts=tasks.filter(t=>filter==='未分类'?!t.tag:eligible(t));
 if(view==='today'){
 const chosen=ts.filter(t=>open(t)&&t.plan===TODAY),done=ts.filter(t=>t.state==='done'&&t.completed===TODAY),later=ts.filter(t=>open(t)&&t.plan!==TODAY),overdue=ts.filter(t=>open(t)&&t.plan&&t.plan<TODAY);
 $('#tr-page').innerHTML=`<div class="tr-grid"><div class="tr-task-column">${capture()}${overdue.length?`<div class="tr-notice"><span>还有 ${overdue.length} 件之前安排的事</span><button type="button" data-action="overdue">重新安排</button></div>`:''}${group('今天想推进',chosen,'normal','今天还没有安排。去待办里选一件，或给自己留白。')}${group('今天已完成',done,'normal','完成的事会留在这里。')}<div class="tr-sectionhead"><h2>留给以后<small>${later.length}</small></h2><button type="button" class="tr-button tr-quiet" data-view="todos">查看全部 ${icon('arrow-right')}</button></div>${later.slice(0,2).map(t=>row(t,'later')).join('')}<p class="tr-sectionfoot">不必把每个想法都塞进今天。</p></div>${todayRight()}</div>`;
 }else{
 $('#tr-page').innerHTML=`<div class="tr-grid"><div class="tr-task-column">${capture()}${group('进行中',ts.filter(t=>t.state==='doing'))}${group('准备做',ts.filter(t=>t.state==='ready'),'later')}${group('想法',ts.filter(t=>t.state==='idea'),'idea','一闪而过的想法，也值得被记下。')}</div><aside class="tr-right"><div class="tr-eyebrow">一件事的历程</div><h2>从想法，到留下痕迹</h2><p class="tr-sectionfoot" style="font-size:14px;line-height:24px;margin:14px 0 24px">记下时不用想清一切。准备好了，再选一天开始。</p><div class="tr-memory"><small>随手记</small><h3>先接住想法</h3><p>标题就够了，项目与日期都可留空。</p></div><div class="tr-memory"><small>选择与投入</small><h3>今天，想推进哪件事？</h3><p>安排不是截止；计时记录真正投入的片段。</p></div><div class="tr-memory"><small>完成，或主动放下</small><h3>每一段尝试都有位置</h3><p>到回望里，看看自己走过的路。</p></div><button type="button" class="tr-button" data-view="review">去回望 ${icon('arrow-right')}</button></aside></div>`;
 }
 icons();
}
function renderReview(){
 const ts=tasks.filter(t=>filter==='未分类'?!t.tag:eligible(t)),closed=ts.filter(t=>(t.state==='done'?t.completed:t.state==='dropped'?t.closed:'')?.startsWith(month)).sort((a,b)=>(b.completed||b.closed).localeCompare(a.completed||a.closed));
 const ls=allLogs().filter(l=>l.date.startsWith(month)&&ts.some(t=>t.id===l.task)),total=ls.reduce((s,l)=>s+l.seconds,0),days=new Set(ls.map(l=>l.date)).size,done=closed.filter(t=>t.state==='done').length;
 const tagmap=new Map();ls.forEach(l=>{const tag=find(l.task).tag||'未分类';tagmap.set(tag,(tagmap.get(tag)||0)+l.seconds);});
 const isOct=month==='2026-10';
 $('#tr-page').innerHTML=`<section class="tr-review-hero"><div><div class="tr-eyebrow">${isOct?'十月，还在继续':'九月，留下一次出发'}</div><h2>${closed.length?(filter==='全部'?(isOct?'你做的事，正在慢慢长成生活。':'一个想法，终于有了自己的模样。'):'在这些事情上，你留下了足迹。'):'这一页，留给未来的经历。'}</h2><div class="tr-review-stats"><div class="tr-review-stat"><strong>${done}</strong><span>件事，已经完成</span></div><div class="tr-review-stat"><strong>${fmt(total)}</strong><span>有记录的投入</span></div><div class="tr-review-stat"><strong>${days}</strong><span>天，留下投入记录</span></div></div></div></section><div class="tr-grid"><div class="tr-task-column"><div class="tr-sectionhead"><h2>这个月留下了什么</h2><small>按结束日期 · ${filter==='全部'?'全部事项':esc(filter)}</small></div><div style="margin-top:24px">${closed.length?closed.map(t=>`<article class="tr-memory"><small>${(t.completed||t.closed).slice(5).replace('-',' 月 ')} 日 · ${t.state==='dropped'?'主动放下':'完成'}</small><h3><button type="button" data-action="detail" data-id="${t.id}">${esc(t.title)}</button></h3><p>${esc(t.note)}</p><div class="tr-row-meta">${tag(t)}<span>${fmt(taskSeconds(t.id))}累计投入</span></div></article>`).join(''):'<p class="tr-empty">这个月份还没有结束的事项。有投入的尝试也会计入右侧记录。</p>'}</div><p class="tr-sectionfoot">历史保留成果，也保留认真尝试后决定放下的事。</p></div><aside class="tr-right"><div class="tr-sectionhead"><h2>这一月，精力去了哪里</h2></div><div class="tr-stack" aria-label="本月按项目标签的投入分配">${[...tagmap].map(([t,s])=>`<span style="flex:${s}" aria-label="${esc(t)} ${fmt(s)}"></span>`).join('')}</div>${[...tagmap].map(([t,s],i)=>`<div class="tr-allocation"><span class="tr-swatch" style="${i===1?'background:var(--p-light)':i===2?'background:var(--p-warm-ink)':''}"></span><span>${esc(t)}</span><span>${fmt(s)}</span></div>`).join('')||'<small>还没有投入记录。</small>'}<div class="tr-sectionhead" style="margin-top:30px"><h2>走过的足迹</h2></div>${closed.some(t=>t.id==='first')?`<div class="tr-badge"><div class="tr-badge-emblem">${icon('flag')}</div><h3>第一次，把想法交付</h3><p>9 月 29 日 · 助手有了第一个可用版本</p><button type="button" class="tr-button tr-quiet" data-action="detail" data-id="first">回到那一天 ${icon('arrow-right')}</button></div>`:''}${closed.some(t=>t.id==='terminal')?`<div class="tr-badge"><div class="tr-badge-emblem">${icon('sprout')}</div><h3>一个想法，走到了完成</h3><p>10 月 4 日记下，10 月 12 日完成。<br>你为终端功能投入了 4 小时 30 分。</p><button type="button" class="tr-button tr-quiet" data-action="detail" data-id="terminal">看看这段历程 ${icon('arrow-right')}</button></div>`:''}${closed.some(t=>t.id==='photo')?`<div class="tr-badge"><div class="tr-badge-emblem">${icon('mountain')}</div><h3>也给生活留了一页</h3><p>整理照片，把秋天的一个下午留了下来。</p><button type="button" class="tr-button tr-quiet" data-action="detail" data-id="photo">翻开这一页 ${icon('arrow-right')}</button></div>`:''}<p class="tr-review-note">${isOct?'做出一点东西，读进去几页书，留住一个秋天的下午。':'从空白开始，也是一段值得记住的路。'}</p><small>文字与数据均为演示内容；统计仅覆盖已记录的投入。</small></aside></div>`;
}
function closeOverlay(){const overlay=$('#tr-overlay');overlay.hidden=true;overlay.innerHTML='';detail=null;lastFocus?.focus();}
let lastFocus=null;
function drawer(title,content){const overlay=$('#tr-overlay');if(overlay.hidden)lastFocus=document.activeElement;overlay.hidden=false;overlay.innerHTML=`<section class="tr-drawer" role="dialog" aria-modal="true" aria-labelledby="tr-dialog-title"><header class="tr-drawer-head"><span id="tr-dialog-title">${esc(title)}</span><button type="button" class="tr-iconbutton" data-action="close" aria-label="关闭面板">${icon('x')}</button></header>${content}</section>`;icons();overlay.querySelector('input,select,textarea,button')?.focus();}
function showDetail(id){const t=find(id);detail=id;drawer('事项详情',`<div class="tr-row-meta">${tag(t)}<span>${{idea:'想法',ready:'准备做',doing:'进行中',done:'已完成',dropped:'已放下'}[t.state]}</span></div><h2>${esc(t.title)}</h2><form id="tr-detail-form"><label class="tr-field"><span>标题</span><input name="title" value="${esc(t.title)}" maxlength="160" required></label><div class="tr-fieldpair"><label class="tr-field"><span>项目标签 · 可不选</span><select name="tag">${['','Minis','生活','学习'].map(s=>`<option value="${s}" ${s===(t.tag||'')?'selected':''}>${s||'未分类'}</option>`).join('')}</select></label><label class="tr-field"><span>计划哪天做 · 不是截止</span><input type="date" name="plan" value="${t.plan||''}"></label></div><label class="tr-field"><span>备注 / 放下的原因</span><textarea name="note">${esc(t.note)}</textarea></label><button type="submit" class="tr-button tr-primary">保存修改</button></form><div class="tr-drawer-actions"><button type="button" class="tr-button" data-action="complete" data-id="${t.id}">${t.state==='done'?'重新打开':'标记完成'}</button>${open(t)?`<button type="button" class="tr-button" data-action="drop" data-id="${t.id}">决定放下</button><button type="button" class="tr-button" data-action="plan" data-id="${t.id}">安排到今天</button>`:t.state==='dropped'?`<button type="button" class="tr-button" data-action="reopen" data-id="${t.id}">重新打开</button>`:''}<button type="button" class="tr-button" data-action="log" data-id="${t.id}">补记投入</button></div><div class="tr-events"><h3>这件事的历程</h3>${t.events.map(([date,text])=>`<div class="tr-event"><small>${esc(date)}</small>${esc(text)}</div>`).join('')}${allLogs().filter(l=>l.task===id).map(l=>`<div class="tr-event"><small>${esc(l.date)} · ${esc(l.start)} — ${esc(l.end)}</small>投入 ${fmt(l.seconds)}${l.note?' · '+esc(l.note):''}</div>`).join('')}<div class="tr-sectionfoot">累计投入 ${fmt(taskSeconds(id))} · 创建于 ${t.created}</div></div>`);detail=id;}
function showNew(){drawer('记一件事',`<h2>先接住这个想法。</h2><form id="tr-new-form"><label class="tr-field"><span>想做什么</span><input name="title" maxlength="160" placeholder="比如：让助手记得我上次做到哪里" required></label><label class="tr-field"><span>项目标签 · 可不选</span><select name="tag">${['','Minis','生活','学习'].map(s=>`<option value="${s}" ${s===filter?'selected':''}>${s||'未分类'}</option>`).join('')}</select></label><label class="tr-field"><span>计划哪天做 · 可留空</span><input type="date" name="plan"></label><label class="tr-field"><span>补充几句 · 可留空</span><textarea name="note" placeholder="记下最初为什么想做它。"></textarea></label><button type="submit" class="tr-button tr-primary">收下这个想法</button></form>`);$('#tr-new-form input').focus();}
function showLog(id){drawer('补记一段投入',`<h2>刚才，把时间给了什么？</h2><form id="tr-log-form"><label class="tr-field"><span>投入的事项</span><select name="task">${tasks.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label><label class="tr-field"><span>日期</span><input type="date" name="date" value="${TODAY}" max="${TODAY}" required></label><div class="tr-fieldpair"><label class="tr-field"><span>开始</span><input type="time" name="start" value="12:00" required></label><label class="tr-field"><span>结束</span><input type="time" name="end" value="12:30" required></label></div><label class="tr-field"><span>这一段做了什么 · 可留空</span><input name="note" maxlength="200" placeholder="比如：把模糊的需求梳理清楚"></label><p class="tr-form-error" id="tr-log-error" role="alert"></p><button type="submit" class="tr-button tr-primary">记下这段时间</button><p class="tr-sectionfoot">补记与计时使用同一份记录，时段不能重叠。预览采用演示日期。</p></form>`);}
function pause(){if(!active)return;logs.push({id:Date.now(),task:active.task,date:active.date,start:active.label,end:timeLabel(),seconds:seconds(),note:'专注计时'});active=null;}
function plan(id){const t=find(id);if(!open(t))return;t.plan=TODAY;if(t.state==='idea')t.state='ready';t.events.push([TODAY,'安排到今天']);render();if(detail===id)showDetail(id);toast('已安排到今天');}
function start(id){const t=find(id);if(!open(t))return;if(active?.task===id)return;pause();active={task:id,began:Date.now(),date:TODAY,label:timeLabel()};t.state='doing';if(!t.first){t.first=TODAY;t.events.push([TODAY,'第一次开始投入']);}render();toast('开始投入：'+t.title);}
function complete(id){const t=find(id);if(active?.task===id)pause();if(t.state==='done'){t.state='ready';delete t.completed;t.events.push([TODAY,'重新打开']);toast('已重新打开，原历程保留');}else{t.state='done';t.completed=TODAY;delete t.closed;t.events.push([TODAY,'完成']);toast('又留下一件做过的事。');}render();if(detail===id)showDetail(id);}
function addTask(data){const title=String(data.get('title')||'').trim();if(!title)return null;const t={id:'new-'+Date.now(),title,tag:String(data.get('tag')||''),state:data.get('plan')?'ready':'idea',plan:String(data.get('plan')||''),note:String(data.get('note')||''),created:TODAY,events:[[TODAY,'记下想法']]};tasks.unshift(t);return t;}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){view=b.dataset.view;render();persist();return;}
 if(b.dataset.filter){filter=b.dataset.filter;render();persist();return;}
 const action=b.dataset.action,id=b.dataset.id;
 if(action==='close')return closeOverlay();
 if(action==='new')return showNew();
 if(action==='detail')return showDetail(id);
 if(action==='log')return showLog(id);
 if(action==='start')return start(id);
 if(action==='pause'){pause();render();return toast('这一段投入已经留下记录。');}
 if(action==='complete')return complete(id);
 if(action==='plan')return plan(id);
 if(action==='pick'){view='todos';render();persist();return toast('在想做的事旁，点击「开始」');}
 if(action==='drop'){const t=find(id);if(active?.task===id)pause();t.state='dropped';t.closed=TODAY;t.events.push([TODAY,'主动放下']);render();showDetail(id);return toast('放下也有它的位置，投入与历程已保留。');}
 if(action==='reopen'){const t=find(id);t.state='ready';delete t.closed;t.events.push([TODAY,'重新打开']);render();showDetail(id);return;}
 if(action==='month-prev'||action==='month-next'){month=action==='month-prev'?'2026-09':'2026-10';render();persist();return;}
 if(action==='overdue'){view='todos';render();persist();}
});
root.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target,data=new FormData(form);
 if(form.id==='tr-capture-form'){const title=$('#tr-capture-input').value.trim();if(!title)return;const d=new FormData();d.set('title',title);d.set('tag',['Minis','生活','学习'].includes(filter)?filter:'');addTask(d);view='todos';render();persist();toast('想法已收下，不必现在就做。');}
 if(form.id==='tr-new-form'){if(!addTask(data))return;closeOverlay();view='todos';render();persist();toast('想法已收下');}
 if(form.id==='tr-detail-form'){const t=find(detail),title=String(data.get('title')||'').trim();if(!title)return;t.title=title;t.tag=String(data.get('tag')||'');t.note=String(data.get('note')||'');const newPlan=String(data.get('plan')||'');if(newPlan!==(t.plan||''))t.events.push([TODAY,newPlan?'改为计划 '+newPlan:'暂不安排日期']);t.plan=newPlan;if(t.state==='idea'&&newPlan)t.state='ready';render();showDetail(t.id);toast('已保存');}
 if(form.id==='tr-log-form'){
  const date=String(data.get('date')),a=String(data.get('start')),b=String(data.get('end')),toMin=s=>Number(s.slice(0,2))*60+Number(s.slice(3)),error=$('#tr-log-error');
  if(date>TODAY||!date){error.textContent='只能补记演示日期及之前的投入。';return;}
  if(toMin(b)<=toMin(a)){error.textContent='结束时间需要晚于开始时间。';return;}
  if(date===TODAY&&b>timeLabel()){error.textContent='这段时间还没有发生，请选择更早的时段。';return;}
  if(allLogs().some(l=>l.date===date&&toMin(a)<toMin(l.id==='active'?timeLabel():l.end)&&toMin(b)>toMin(l.start))){error.textContent='和已有投入记录重叠了，请核对时段。';return;}
  const t=find(String(data.get('task')));logs.push({id:Date.now(),task:t.id,date,start:a,end:b,seconds:(toMin(b)-toMin(a))*60,note:String(data.get('note')||'')});if(!t.first||date<t.first){t.first=date;t.events.push([date,'投入记录 · 补记']);}closeOverlay();render();toast('这段投入已记下');
 }
});
root.addEventListener('change',e=>{if(e.target.id==='tr-note'){daynote=e.target.value;$('#tr-note-status').textContent='已留在本次预览中';}});
$('#tr-overlay').addEventListener('click',e=>{if(e.target===$('#tr-overlay'))closeOverlay();});
root.addEventListener('keydown',e=>{
 if(e.target.matches('.tr-tabs button')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  e.preventDefault();const tabs=[...root.querySelectorAll('.tr-tabs button')],index=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click();tabs[next].focus();return;
 }
 const overlay=$('#tr-overlay');if(overlay.hidden)return;
 if(e.key==='Escape'){closeOverlay();return;}
 if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
render();
setInterval(()=>{const c=$('#tr-clock');if(c)c.textContent=clock();},1000);
if(globalThis.Tweak){const options={showTimeline:true};const tweak=new Tweak({container:root,onChange:()=>{const el=$('.tr-timeline');if(el)el.hidden=!options.showTimeline;}});tweak.addToggle(options,'showTimeline',{label:'显示今天的投入明细'});}
})();
</script>

</body></html>
