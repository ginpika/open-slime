<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>终末地启动器 · UI 布局复刻</title>
<style>
  /* =========================================================
     画布基准：1024 × 576
     外壳内边距 10px，左侧导航与主内容为两个独立圆角容器
     ========================================================= */
  :root{
    --radius-shell:18px;   /* 外壳圆角 */
    --radius-card:14px;    /* 两个容器各自的圆角 */
    --pad:10px;            /* 亚克力圈宽度 */
    --gap:10px;            /* 左栏与内容页间距 */
    --rail-w:56px;         /* 左侧导航宽度 */

    --line:rgba(255,255,255,.10);
    --text:#f2f4f8;
    --text-dim:#9aa2b1;
    --text-mute:#6f7787;
    --yellow:#ffcf1b;
    --yellow-deep:#f2b400;

    --font-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --font-display:"Noto Serif SC","Songti SC","STZhongsong",serif;

    --ph:rgba(255,255,255,.13);      /* 占位块填充 */
    --ph-line:rgba(255,255,255,.09); /* 占位块描边 */
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  /* 桌面壁纸：用于体现底层亚克力的磨砂透过效果 */
  body{
    font-family:var(--font-cn);
    color:var(--text);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(38% 42% at 14% 18%, #6d4bd8 0%, transparent 62%),
      radial-gradient(42% 46% at 86% 26%, #2b7fd4 0%, transparent 64%),
      radial-gradient(46% 50% at 72% 88%, #d4713f 0%, transparent 62%),
      radial-gradient(44% 48% at 22% 86%, #1f8f7a 0%, transparent 62%),
      #0e1018;
    -webkit-font-smoothing:antialiased;
  }

  /* =========================================================
     1. 外壳
     ========================================================= */
  .launcher{
    position:relative;
    width:1024px;height:576px;
    flex:none;
    border-radius:var(--radius-shell);
    padding:var(--pad);
    display:flex;
    gap:var(--gap);
    user-select:none;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  }

  /* ---------- 1.1 最底层：磨砂亚克力半透明遮罩（一圈） ---------- */
  .acrylic{
    position:absolute;
    inset:0;
    z-index:0;
    border-radius:var(--radius-shell);
    background:rgba(14,16,22,.52);
    backdrop-filter:blur(38px) saturate(160%);
    -webkit-backdrop-filter:blur(38px) saturate(160%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.10),   /* 外缘高光描边 */
      inset 0 1px 0 rgba(255,255,255,.16);    /* 顶部受光 */
  }
  /* 亚克力表面的一层极淡光泽，模拟材质反射 */
  .acrylic::after{
    content:"";
    position:absolute;inset:0;
    border-radius:inherit;
    background:linear-gradient(150deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.02) 32%,transparent 60%);
    pointer-events:none;
  }

  /* 通用占位块：所有图标/图片均以此标注尺寸与位置 */
  .ph{
    background:var(--ph);
    border-radius:6px;
    box-shadow:inset 0 0 0 1px var(--ph-line);
    flex:none;
  }

  /* =========================================================
     2. 左侧导航容器（独立圆角）
     ========================================================= */
  .rail{
    position:relative;
    z-index:1;
    width:var(--rail-w);
    height:100%;
    flex:none;
    border-radius:var(--radius-card);
    background:rgba(8,9,12,.55);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 0 18px;
  }
  .rail-logo{ width:28px;height:28px;border-radius:8px }          /* 顶部品牌标 28×28 */
  .rail-apps{
    margin-top:126px;                                             /* 图标组起始 y≈142 */
    display:flex;flex-direction:column;gap:12px;
  }
  .app-icon{ width:38px;height:38px;border-radius:11px }          /* 应用图标 38×38，间距 12 */
  .rail-grid{ margin-top:auto;width:26px;height:26px;border-radius:7px } /* 底部宫格 26×26 */

  /* =========================================================
     3. 主内容容器（独立圆角）
     ========================================================= */
  .stage{
    position:relative;
    z-index:1;
    flex:1;
    height:100%;
    border-radius:var(--radius-card);
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 44%, rgba(226,236,255,.40) 0%, transparent 58%),
      radial-gradient(70% 60% at 26% 18%, rgba(126,84,214,.46) 0%, transparent 62%),
      radial-gradient(65% 55% at 76% 26%, rgba(84,138,232,.36) 0%, transparent 60%),
      radial-gradient(90% 70% at 12% 96%, rgba(40,26,72,.80) 0%, transparent 60%),
      linear-gradient(158deg,#2a2352 0%,#46569c 30%,#8ea4d2 52%,#4b4380 76%,#191527 100%);
  }

  /* ---------- 3.1 顶部窗口控制区：top 14 / right 14 ---------- */
  .topbar{
    position:absolute;
    top:14px;right:14px;
    display:flex;align-items:center;gap:10px;
    z-index:6;
  }
  .user-chip{
    display:flex;align-items:center;gap:8px;
    height:32px;padding:0 14px 0 8px;
    border-radius:16px;
    background:rgba(8,10,14,.66);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
    font-size:12.5px;letter-spacing:.4px;color:#e8ebf2;
  }
  .chip-avatar{ width:20px;height:20px;border-radius:5px }        /* 头像 20×20 */
  .icon-btn{ width:34px;height:34px;border-radius:50% }           /* 功能按钮 34×34 */
  .icon-btn.plain{                                              /* 最小化/关闭：无底 */
    width:30px;height:30px;border-radius:8px;
    background:transparent;
    box-shadow:none;
  }

  /* ---------- 3.2 右侧功能栏：right 8 / top 128 ---------- */
  .rail-side{
    position:absolute;
    right:8px;top:128px;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    z-index:5;
  }
  .rail-btn{ width:28px;height:28px;border-radius:8px }           /* 功能按钮 28×28 */
  .rail-side-bottom{ position:absolute;right:8px;bottom:22px;z-index:5; }

  /* ---------- 3.3 左上角品牌 ---------- */
  .brand{ position:absolute;left:36px;top:56px; }
  .brand-mark{ width:16px;height:16px;border-radius:4px;margin-bottom:6px }
  .brand-cn{
    font-family:var(--font-display);
    font-size:29px;font-weight:800;letter-spacing:3px;color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.55);
  }
  .brand-en{
    margin-top:5px;font-size:7px;letter-spacing:2.4px;line-height:1.5;
    color:rgba(255,255,255,.72);text-transform:uppercase;
  }

  /* ---------- 3.4 中央标题 ---------- */
  .hero{
    position:absolute;left:45%;top:42%;
    transform:translate(-50%,-50%);
    text-align:center;z-index:4;pointer-events:none;
  }
  .hero-emblem{ width:60px;height:34px;margin:0 auto 6px }        /* 徽记 60×34 */
  .hero-cn{
    font-family:var(--font-display);
    font-size:52px;font-weight:700;letter-spacing:8px;line-height:1.05;
    background:linear-gradient(180deg,#fff 10%,#e8ddff 58%,#bdaef2 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 16px rgba(40,20,90,.75));
  }
  .hero-en{
    margin-top:2px;font-size:19px;font-weight:600;
    letter-spacing:11px;text-indent:11px;
    background:linear-gradient(180deg,#fff,#c8c2ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-sub{
    margin-top:9px;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:8px;letter-spacing:2.4px;color:rgba(255,255,255,.82);
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  .hero-sub .rule{
    width:34px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  }

  /* ---------- 3.5 底部区域：left 44 / right 16 / bottom 18 ---------- */
  .bottom{
    position:absolute;
    left:44px;right:16px;bottom:18px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    z-index:6;
  }
  .bottom-left{ display:flex;align-items:flex-end;gap:38px; }

  /* 版本导读卡 190×116 */
  .version-card{
    position:relative;
    width:190px;height:116px;
    border-radius:10px;
    background:rgba(10,12,18,.66);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
    backdrop-filter:blur(8px);
    padding:9px 10px;
    display:flex;flex-direction:column;align-items:flex-end;
  }
  .vc-thumb{ position:absolute;left:9px;top:9px;width:78px;height:98px;border-radius:6px } /* 缩略图位 78×98 */
  .vc-tag{ font-size:10px;letter-spacing:1px;color:#f2d492 }
  .vc-title{
    margin-top:14px;font-size:15px;font-weight:700;letter-spacing:1px;
    color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);
  }
  .vc-action{
    position:absolute;left:10px;right:10px;bottom:9px;
    height:20px;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:0 6px;border-radius:5px;
    background:linear-gradient(90deg,rgba(255,255,255,.20),rgba(255,255,255,.06));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.20);
    font-size:9.5px;letter-spacing:.4px;color:#fff;
  }
  .vc-badge{
    flex:none;padding:1px 5px;border-radius:4px;
    background:linear-gradient(180deg,#ff8a3c,#e8552c);
    font-size:8.5px;font-weight:700;letter-spacing:.3px;
  }

  /* 公告面板 394×116 */
  .announce{
    width:394px;height:116px;
    border-radius:10px;
    background:rgba(10,12,18,.66);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
    backdrop-filter:blur(10px);
    padding:8px 12px 6px;
    display:flex;flex-direction:column;
  }
  .tabs{
    display:flex;align-items:center;gap:16px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .tab{ position:relative;font-size:11.5px;letter-spacing:.8px;color:var(--text-mute) }
  .tab.active{ color:#fff;font-weight:700 }
  .tab.active::after{
    content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    width:16px;height:2px;border-radius:1px;background:var(--yellow);
  }
  .news{ flex:1;display:flex;flex-direction:column;justify-content:space-around;padding-top:2px }
  .news-row{ display:flex;align-items:center;gap:7px;font-size:10.5px;color:#c8cedb;letter-spacing:.3px }
  .news-row .dot{ flex:none;width:5px;height:5px;transform:rotate(45deg);background:#8c93a3 }
  .news-row.hot .dot{ background:#ff6a4d }
  .news-row .txt{ flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis }
  .news-row .date{ flex:none;color:var(--text-mute);font-size:10px;letter-spacing:.5px }

  /* 开始游戏按钮组 */
  .bottom-right{ display:flex;flex-direction:column;align-items:flex-end;gap:7px }
  .play-row{ display:flex;align-items:center;gap:9px }
  .play-btn{
    height:46px;padding:0 26px 0 8px;
    border-radius:23px;
    display:flex;align-items:center;gap:9px;
    background:linear-gradient(180deg,var(--yellow),var(--yellow-deep));
    box-shadow:0 8px 22px rgba(255,190,20,.28),inset 0 1px 0 rgba(255,255,255,.5);
    font-size:16.5px;font-weight:800;letter-spacing:1.5px;color:#1a1200;
  }
  .play-disc{ width:32px;height:32px;border-radius:50%;background:#fff;flex:none } /* 播放图标位 32×32 */
  .menu-btn{
    width:46px;height:46px;border-radius:23px;
    background:linear-gradient(180deg,#2c303a,#14171e);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
    display:flex;align-items:center;justify-content:center;
  }
  .dx-hint{ font-size:10px;letter-spacing:.5px;color:rgba(255,255,255,.60);text-shadow:0 1px 6px rgba(0,0,0,.7) }
  .dx-hint b{ color:#fff;font-weight:700 }

  /* 小屏等比缩放 */
  @media (max-width:1080px){ .launcher{ transform:scale(.86) } }
  @media (max-width:900px){ .launcher{ transform:scale(.68) } }
  @media (max-width:720px){ .launcher{ transform:scale(.5) } }
</style>
</head>
<body>

<div class="launcher">

  <!-- ===== 第 0 层：磨砂亚克力半透明遮罩（一圈可见） ===== -->
  <div class="acrylic"></div>

  <!-- ===== 左侧导航：独立圆角容器 56×556 ===== -->
  <aside class="rail">
    <div class="ph rail-logo"></div>

    <div class="rail-apps">
      <div class="ph app-icon"></div>
      <div class="ph app-icon"></div>
      <div class="ph app-icon"></div>
    </div>

    <div class="ph rail-grid"></div>
  </aside>

  <!-- ===== 主内容页：独立圆角容器 938×556 ===== -->
  <main class="stage">

    <!-- 顶部窗口控制区：top 14 / right 14，含用户胶囊(32) + 3 个 34×34 按钮 + 2 个 30×30 按钮 -->
    <div class="topbar">
      <div class="user-chip">
        <span class="ph chip-avatar"></span>
        137****9505
      </div>
      <div class="ph icon-btn"></div>
      <div class="ph icon-btn"></div>
      <div class="ph icon-btn"></div>
      <div class="ph icon-btn plain"></div>
      <div class="ph icon-btn plain"></div>
    </div>

    <!-- 右侧功能栏：right 8 / top 128，9 个 28×28 图标，纵向间距 7 -->
    <div class="rail-side">
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
      <div class="ph rail-btn"></div>
    </div>

    <!-- 右侧功能栏底部独立入口：right 8 / bottom 22 -->
    <div class="rail-side-bottom">
      <div class="ph rail-btn"></div>
    </div>

    <!-- 左上角品牌：left 36 / top 56 -->
    <div class="brand">
      <div class="ph brand-mark"></div>
      <div class="brand-cn">终末地</div>
      <div class="brand-en">Arknights<br/>Endfield</div>
    </div>

    <!-- 中央标题：left 45% / top 42% -->
    <div class="hero">
      <div class="ph hero-emblem"></div>
      <div class="hero-cn">雪松幽梦</div>
      <div class="hero-en">MISTY SNOW</div>
      <div class="hero-sub">
        <span class="rule"></span>
        BY DREAMS CAPE OF WIND AND SNOW
        <span class="rule"></span>
      </div>
    </div>

    <!-- 底部区域：left 44 / right 16 / bottom 18 -->
    <div class="bottom">

      <div class="bottom-left">

        <!-- 版本导读卡 190×116 -->
        <div class="version-card">
          <div class="ph vc-thumb"></div>
          <span class="vc-tag">丹青颂</span>
          <div class="vc-title">新版本导读</div>
          <div class="vc-action">
            <span>限时寻访提前解锁</span>
            <span class="vc-badge">+1000</span>
          </div>
        </div>

        <!-- 公告面板 394×116 -->
        <div class="announce">
          <div class="tabs">
            <span class="tab active">公告</span>
            <span class="tab">新闻</span>
            <span class="tab">资讯</span>
          </div>
          <div class="news">
            <div class="news-row hot">
              <span class="dot"></span>
              <span class="txt">「凝合｜山阳团！」趣味活动说明</span>
              <span class="date">09/30</span>
            </div>
            <div class="news-row">
              <span class="dot"></span>
              <span class="txt">「绚异异形」重构寻访#1与「点绘申领」重构申…</span>
              <span class="date">09/23</span>
            </div>
            <div class="news-row">
              <span class="dot"></span>
              <span class="txt">「雪松幽梦」版本更新说明</span>
              <span class="date">09/12</span>
            </div>
          </div>
        </div>

      </div>

      <!-- 开始游戏：黄色药丸 h46 + 深色方按钮 46×46，下方 DirectX 提示 -->
      <div class="bottom-right">
        <div class="play-row">
          <div class="play-btn">
            <span class="play-disc"></span>
            开始游戏
          </div>
          <div class="menu-btn"></div>
        </div>
        <div class="dx-hint"><b>DirectX 11</b> 启动（重启将默认使用）</div>
      </div>

    </div>
  </main>
</div>

</body>
</html>
