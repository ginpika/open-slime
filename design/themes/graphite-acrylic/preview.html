<!doctype html>
<html lang="zh-CN" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>深灰亚克力 · 桌面外壳归档</title>
  <link rel="stylesheet" href="source/frontend/src/shell/desktopFrame.css">
  <style>
    * { box-sizing: border-box; }
    html { --c-bg: #fff; --preview-ink: #0f0f0f; --preview-muted: #6b7280; }
    html[data-scheme="dark"] { --c-bg: #151517; --preview-ink: #f2f4f8; --preview-muted: #9aa2b1; }
    body { margin: 0; font: 14px/1.6 system-ui, "PingFang SC", sans-serif; background: linear-gradient(130deg, #9baeb7, #c3b2aa 50%, #667c91); }
    a { text-decoration: none; }
    .preview-content { height: 100%; overflow: auto; color: var(--preview-ink); padding: clamp(24px, 5vw, 72px); }
    .preview-content h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 500; letter-spacing: -.03em; margin: 8px 0 16px; }
    .preview-content p { color: var(--preview-muted); max-width: 600px; }
    .preview-meta { font-size: 12px; letter-spacing: .12em; color: var(--preview-muted); }
    .preview-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ffcf1b; margin-right: 8px; }
    .preview-toggle { margin-top: 28px; border: 1px solid var(--preview-muted); border-radius: 8px; background: transparent; color: inherit; padding: 9px 14px; font: inherit; cursor: pointer; }
    .preview-specs { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 64px; }
    .preview-specs strong { display: block; font-size: 24px; font-weight: 500; }
    .preview-specs span { color: var(--preview-muted); font-size: 12px; }
    .df__item svg { fill: none; stroke: currentColor; }
    .preview-footnote { margin-top: 48px; font-size: 12px; }
  </style>
</head>
<body>
  <!-- 历史 lucide 图标直接内嵌，确保 file:// 打开也能显示；许可证随 source 保存。 -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="launch" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"></path><circle cx="12" cy="12" r="10"></circle></g></symbol><symbol id="user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></g></symbol><symbol id="mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></g></symbol><symbol id="about" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></g></symbol><symbol id="minimize" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></g></symbol><symbol id="maximize" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect></g></symbol><symbol id="restore" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></g></symbol><symbol id="close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></g></symbol></svg>
  <div class="df">
    <div class="df__acrylic" aria-hidden="true"></div>
    <aside class="df__rail">
      <div class="df__brand"><img src="source/frontend/public/icon-64x64.png" alt="历史应用标志"></div>
      <nav class="df__menu" aria-label="外壳导航预览">
        <a class="df__item" href="#preview" title="启动" aria-label="启动" aria-current="page"><svg class="df__icon" viewBox="0 0 24 24"><use href="#launch"/></svg></a>
        <a class="df__item" href="#preview" title="用户" aria-label="用户"><svg class="df__icon" viewBox="0 0 24 24"><use href="#user"/></svg></a>
        <a class="df__item" href="#preview" title="邮件" aria-label="邮件"><svg class="df__icon" viewBox="0 0 24 24"><use href="#mail"/></svg></a>
        <a class="df__item" href="#preview" title="关于" aria-label="关于"><svg class="df__icon" viewBox="0 0 24 24"><use href="#about"/></svg></a>
      </nav>
    </aside>
    <main class="df__stage">
      <div class="df__titlebar">
        <div class="df__drag"></div>
        <div class="df-chip"><span class="df-chip__name">深灰亚克力</span></div>
        <div class="df__win" aria-label="窗口控件外观预览">
          <button class="df__wbtn" type="button" aria-label="最小化（预览）"><svg viewBox="0 0 24 24"><use href="#minimize"/></svg></button>
          <button class="df__wbtn" type="button" aria-label="最大化（预览）"><svg viewBox="0 0 24 24"><use href="#maximize"/></svg></button>
          <button class="df__wbtn" type="button" aria-label="关闭（预览）"><svg viewBox="0 0 24 24"><use href="#close"/></svg></button>
        </div>
      </div>
      <div class="df__view">
        <article class="preview-content" id="preview">
          <div class="preview-meta"><span class="preview-swatch"></span>GRAPHITE ACRYLIC / ARCHIVED</div>
          <h1>深灰侧栏，半透明窗缘。</h1>
          <p>从 2026 年 10 月的 Git 历史中保留，作为未来的桌面端主题候选。深灰外壳保持原样，主视图底色可独立切换。</p>
          <button class="preview-toggle" type="button" id="scheme">切换内容区明暗</button>
          <div class="preview-specs">
            <div><strong>88<span> px</span></strong><span>独立深灰导航轨</span></div>
            <div><strong>12<span> px</span></strong><span>半透明窗缘</span></div>
            <div><strong>20<span> px</span></strong><span>统一圆角</span></div>
          </div>
          <p class="preview-footnote">外壳复用历史原始样式；此处为静态预览内容。背景渐变模拟桌面，窗口按钮仅展示外观。</p>
        </article>
      </div>
    </main>
  </div>
  <script>
    document.getElementById('scheme').addEventListener('click', function () {
      var root = document.documentElement;
      root.dataset.scheme = root.dataset.scheme === 'dark' ? 'light' : 'dark';
    });
  </script>
</body>
</html>
