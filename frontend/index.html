<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64x64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icon-128x128.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icon-256x256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>__BRAND_TITLE__</title>
    <script>
      // 防闪烁（FOUC）：React 挂载前把持久化的主题令牌写入 :root，
      // 并同步 data-theme / data-scheme（供无法变量化的样式分支使用）
      ;(function () {
        try {
          var root = document.documentElement
          var raw = localStorage.getItem('minis.theme.v4')
          if (!raw) return
          var s = JSON.parse(raw)
          var vars = s && s.vars
          /* 版本校验：令牌派生逻辑升级后（v4 → v5…）旧快照的令牌集可能过期，
             跳过回放以避免首帧写入过期令牌（最多退化为一帧默认色，而非错误样式） */
          if (!s || s.v !== 4) return
          if (!vars || typeof vars !== 'object') return
          var st = root.style
          for (var k in vars) {
            if (Object.prototype.hasOwnProperty.call(vars, k)) st.setProperty(k, vars[k])
          }
          if (s.themeId) root.dataset.theme = s.themeId
          if (s.scheme) {
            root.dataset.scheme = s.scheme
            st.colorScheme = s.scheme
          }
        } catch (e) {
          /* 忽略损坏数据 */
        }
      })()
    </script>
    <style>
      /* ==========================================================================
       * 桌面壳首帧骨架（仅本机桌面壳，见下面的开关脚本）
       *
       * 背景：换文档到 React 挂载之间，窗口里还没有外壳——首帧只有 canvas 底色
       * （body 的 --c-bg），于是浅色主题下会出现几帧「整窗纯白」，紧接着外壳挂载又是一次
       * 形状跳变（整块纯色 → 12px 圈 + 菜单栏 + 圆角主视图）。这里把外壳预先画出来，
       * 让首帧就已经是外壳形状；DesktopFrame 挂载时（useLayoutEffect）立即撤掉。
       *
       * 尺寸和明暗配色与 shell/desktopFrame.css 同步，使用纯色窗缘与细边框。
       * ========================================================================== */
      #minis-df-skeleton {
        --mds-bg: #ffffff;
        --mds-chrome: #f6f8fa;
        --mds-line: #d1d9e0;
        --mds-frame: #eaeef2;
        display: none;
      }
      :root[data-scheme='dark'] #minis-df-skeleton {
        --mds-bg: #0d0f10;
        --mds-chrome: #141719;
        --mds-line: #2c3236;
        --mds-frame: #0d0f10;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-scheme]) #minis-df-skeleton {
          --mds-bg: #0d0f10;
          --mds-chrome: #141719;
          --mds-line: #2c3236;
          --mds-frame: #0d0f10;
        }
      }
      /* 把底让给桌面：否则首帧仍是一块不透明的 --c-bg（跳变的一半来自这里） */
      html.minis-df-skeleton,
      html.minis-df-skeleton body {
        background: transparent;
      }
      html.minis-df-skeleton #minis-df-skeleton {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        gap: 10px;
        padding: 12px;
        border-radius: 20px;
        overflow: hidden;
        /* 骨架是占位：可看不可点，免得挡住真实窗口按钮 */
        pointer-events: none;
      }
      /* 最底层：纯色窗缘（同 .df__acrylic） */
      .mds-acrylic {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        background: var(--mds-frame);
      }
      /* 左：菜单栏 88px（同 .df__rail；导航图标等挂载后出现，占位不画） */
      .mds-rail {
        position: relative;
        z-index: 1;
        display: flex;
        flex: none;
        flex-direction: column;
        align-items: center;
        width: 88px;
        padding: 16px 0 18px;
        border-radius: 20px;
        background: var(--mds-chrome);
        box-shadow: 0 0 0 1px var(--mds-line);
      }
      .mds-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #fff;
      }
      .mds-logo img {
        width: 46px;
        height: 46px;
      }
      /* 右：主视图（同 .df__stage + .df__titlebar） */
      .mds-stage {
        position: relative;
        z-index: 1;
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        border-radius: 20px;
        overflow: hidden;
        background: var(--c-bg, var(--mds-bg));
        box-shadow: 0 0 0 1px var(--mds-line);
      }
      .mds-titlebar {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 12px 0 8px;
        box-sizing: border-box;
        border-bottom: 1px solid var(--mds-line);
        background: var(--mds-chrome);
      }
      .mds-drag {
        flex: 1;
        align-self: stretch;
      }
      /* 身份胶囊 / 窗口按钮的占位块：与真实控件同尺寸同底色，挂载时只换内容不换形状 */
      .mds-chip,
      .mds-wbtn {
        flex: none;
        background: var(--mds-chrome);
      }
      .mds-chip {
        width: 132px;
        height: 32px;
        border-radius: 16px;
        box-shadow: inset 0 0 0 1px var(--mds-line);
      }
      .mds-wbtn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }
      /* The conversation starts at the window origin, including its 280px rail. */
      html.minis-df-conversation #minis-df-skeleton {
        padding: 0;
        gap: 0;
      }
      html.minis-df-conversation .mds-rail {
        width: 280px;
        padding: 0;
        border-radius: 0;
        box-shadow: inset -1px 0 var(--mds-line);
      }
      html.minis-df-conversation .mds-logo,
      html.minis-df-conversation .mds-titlebar {
        display: none;
      }
      html.minis-df-conversation .mds-stage {
        border-radius: 0;
        box-shadow: none;
      }
      :root[data-scheme='dark'].minis-df-conversation #minis-df-skeleton {
        --mds-bg: #101213;
        --mds-chrome: #151819;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-scheme]).minis-df-conversation #minis-df-skeleton {
          --mds-bg: #101213;
          --mds-chrome: #151819;
        }
      }
    </style>
    <script>
      ;(function () {
        // 只在本机桌面壳里铺骨架（浏览器里 #minis-df-skeleton 保持 display:none）
        if (!('__TAURI_INTERNALS__' in window)) return
        document.documentElement.classList.add('minis-df-skeleton')
        var hash = window.location.hash
        if (!hash || hash === '#' || hash === '#/' || hash.indexOf('#/?') === 0) {
          document.documentElement.classList.add('minis-df-conversation')
        }
        // 兜底：bundle 跑不起来时也别让骨架一直挂着
        setTimeout(function () {
          var el = document.getElementById('minis-df-skeleton')
          if (el) el.remove()
          document.documentElement.classList.remove('minis-df-skeleton', 'minis-df-conversation')
        }, 6000)
      })()
    </script>
  </head>
  <body>
    <!-- 桌面壳首帧骨架：形状与窗口外壳一致，React 挂载后由 DesktopFrame 撤掉（见上方的样式） -->
    <div id="minis-df-skeleton" aria-hidden="true">
      <div class="mds-acrylic"></div>
      <aside class="mds-rail">
        <span class="mds-logo"><img src="/icon-64x64.png" alt="" /></span>
      </aside>
      <div class="mds-stage">
        <div class="mds-titlebar">
          <span class="mds-drag"></span>
          <span class="mds-chip"></span>
          <span class="mds-wbtn"></span>
          <span class="mds-wbtn"></span>
          <span class="mds-wbtn"></span>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
