# minis 前端 nginx：托管 SPA 静态产物，并将 /api 反向代理到后端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端使用 hash 路由：静态资源缺失时回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend 服务（compose 服务名即 DNS 名）
    location /ws/coding/terminals/ {
        proxy_pass http://backend:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3900s;
    }

    # Window screenshots are bounded to 3 MB in the economic analysis API.
    location /api/economy/ {
        client_max_body_size 5m;
        proxy_pass http://backend:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3900s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 包含最长 3600s 的 ComfyUI 工具等待，并为模型收尾留余量
        proxy_buffering off;
        proxy_read_timeout 3900s;
        proxy_send_timeout 300s;
    }
}
