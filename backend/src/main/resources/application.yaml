# minis 后端 M0 配置（占位）。
# 参数经 .env 注入（backend/.env，模板见 .env.example；真实环境变量优先于 .env）。
# 可覆盖项：MINIS_PORT / MINIS_DB_PATH / MINIS_PUBLIC_BASE / MINIS_LOG_FILE / SSO_SERVER_URL /
#   SSO_COOKIE_NAME / LLM_BASE_URL / LLM_API_KEY / LLM_CHAT_MODEL / LLM_SYSTEM_PROMPT /
#   LLM_CONTEXT_WINDOW / EMBEDDING_MODEL / RERANK_MODEL / FAST_WEB_ENABLED
server:
  port: ${MINIS_PORT:18081}

spring:
  # 应用名（spring.application.name）由 MinisApplication 从根目录 branding.json 注入，不在此写死
  datasource:
    url: jdbc:sqlite:${MINIS_DB_PATH:../data/minis.db}   # 相对 maven/docker 工作目录；生产用绝对路径或挂载卷
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  file:
    name: ${MINIS_LOG_FILE:../data/logs/minis.log}   # 落文件便于回溯（相对 maven/docker 工作目录）
  level:
    cc.ginpika.minis: INFO

minis:
  public-base: ${MINIS_PUBLIC_BASE:http://localhost:18081}
  article-dir: ${MINIS_ARTICLE_DIR:../data/article}   # markdown 文章目录（相对 maven 工作目录）
  # 桌面壳（Tauri）：壳以 MINIS_DESKTOP=1 拉起后端并注入一次性令牌，此时 /api/** 需带
  # X-Minis-Token；静态资源与页面不校验。Web 部署保持关闭（默认），行为不变。
  desktop:
    enabled: ${MINIS_DESKTOP:false}
    local-token: ${MINIS_LOCAL_TOKEN:}                # 壳每次启动生成的随机值；空 = 不校验
    local-user-name: ${MINIS_LOCAL_USER_NAME:}        # 壳注入的本地用户名；本机模式顶替 local-dev
    local-user-avatar: ${MINIS_LOCAL_USER_AVATAR:}    # 壳注入的本地用户头像（data URL）；空 = 无
  sso:
    server-url: ${SSO_SERVER_URL:}                    # hostid 生产地址，由使用者填入（§9-3）
    cookie-name: ${SSO_COOKIE_NAME:sso_token}
    token-ttl: 5m
    # /api/admin/** 白名单（role=admin 恒放行；空表时仅 SSO 关闭的 dev 可用）
    admin-usernames: [ginpika]
  llm:
    base-url: ${LLM_BASE_URL:}                        # 带版本前缀，如 https://api.openai.com/v1
    api-key: ${LLM_API_KEY:}
    chat-model: ${LLM_CHAT_MODEL:}                    # AI 会话模型（/chat/completions）
    system-prompt: ${LLM_SYSTEM_PROMPT:}              # 可选：聊天默认 system prompt
    context-window: ${LLM_CONTEXT_WINDOW:262144}      # 内置模型上下文窗口（token 数）；会话页上下文占比用
    embedding-model: ${EMBEDDING_MODEL:}              # 固定供应商+模型；换模型需全库重嵌
    rerank-model: ${RERANK_MODEL:}                    # 精排模型（复用 base-url/api-key）；空则 RAG 保持 RRF 序
    timeout-ms: 30000                                 # 读超时：embedding/rerank 整次请求（聊天走 chat-timeout-ms）
    chat-timeout-ms: ${LLM_CHAT_TIMEOUT_MS:180000}    # 聊天读超时：流式语义=相邻 chunk 最大间隔（含首包等待），摘要长文需更宽
  fast:
    web:
      enabled: ${FAST_WEB_ENABLED:false}              # 默认关：纯私域
      top-k: 10
      cache-ttl: 10m
    keyword-top-k: 20
    vector-top-k: 20
    graph-hops: 2
    rrf-k: 60
    rerank-candidate: 20                              # RAG 精排候选池：RRF 后送 rerank 的前 N 条
  context:                                            # 上下文平面（STEP 2）：主动注入 + 贴临界裁历史
    inject-knowledge: ${CONTEXT_INJECT_KNOWLEDGE:false}  # 每轮按用户输入先召回知识库注入 system（默认关）
    inject-memory: ${CONTEXT_INJECT_MEMORY:true}         # 每轮按用户输入先召回相关记忆条目注入 system（默认开）
    compress-history: ${CONTEXT_COMPRESS_HISTORY:true}   # 逼近窗口时才降级：先丢最早的轮次，仍超再截断
    reserve-output-tokens: ${CONTEXT_RESERVE_OUTPUT_TOKENS:8192} # 给模型输出留的 token（输入输出共用窗口）
    compress-keep-turns: ${CONTEXT_COMPRESS_KEEP_TURNS:2} # 降级时至少保留最近几轮原文
  memory:                                             # 记忆体系 v2（STEP M1-M5）：条目提炼 / 巩固 / 注入
    enabled: ${MEMORY_ENABLED:true}                   # 总开关：关时提炼 / 巩固 / 条目召回一律短路（默认开）
    extract-model: ${MEMORY_EXTRACT_MODEL:}           # 提炼与巩固用模型（llm_model.id）；空 = 沿用聊天默认
    top-k: ${MEMORY_TOP_K:6}                          # 默认注入的条目上限
    min-score: ${MEMORY_MIN_SCORE:0.35}               # 相关性门控阈值：低于它不注入
    noise-min-chars: ${MEMORY_NOISE_MIN_CHARS:6}      # 信息量门槛：短于此且不含「记住」的输入不作素材
    batch-turns: ${MEMORY_BATCH_TURNS:4}              # 攒批：同一会话攒够这么多轮就合并提炼一次（降调用次数）
    idle-ms: ${MEMORY_IDLE_MS:300000}                 # 空闲阈值（毫秒）：会话静默这么久后合并提炼一次
    episode-max: ${MEMORY_EPISODE_MAX:50}             # 情景层（episode）保留条数上限
    body-max-chars: ${MEMORY_BODY_MAX_CHARS:1200}     # 单条记忆正文长度上限（超出截断，正本可回读）
    semantic-consolidate: ${MEMORY_SEMANTIC_CONSOLIDATE:false} # 语义级巩固（P4）：同域新值取代旧值，需一次 LLM，默认关
    semantic-max-items: ${MEMORY_SEMANTIC_MAX_ITEMS:40}        # 语义巩固单轮扫描条目上限（控成本）
    consolidate-interval-ms: ${MEMORY_CONSOLIDATE_INTERVAL_MS:3600000} # 巩固扫描周期（毫秒）
    budget:                                            # 注入 token 预算（memory-v6 §8.3）：按层分桶
      total: ${MEMORY_BUDGET_TOTAL:1600}
      shared: ${MEMORY_BUDGET_SHARED:400}              # L1 共享权威（画像 / 项目事实 / 全局规则）
      agent: ${MEMORY_BUDGET_AGENT:300}                # L2 Agent 私有
      task: ${MEMORY_BUDGET_TASK:300}                  # L3 任务 / 工作集
      publish: ${MEMORY_BUDGET_PUBLISH:200}            # L4 发布（交接 / 知识）
      episode: ${MEMORY_BUDGET_EPISODE:200}
    work:                                              # 工作集（memory-v6 §13）：工作状态与长期记忆分离
      ttl-ms: ${MEMORY_WORK_TTL_MS:604800000}          # 工作项 TTL（到期不再注入）
      distill-on-close: ${MEMORY_WORK_DISTILL:true}    # 会话收尾自动蒸馏进长期记忆
    weights:                                           # 召回权重（memory-v6 §8.2）：余弦 × 层 × 域 × 证据
      layer:
        L1: 1.20
        L2: 1.00
        L3: 0.85
        L4: 1.05
      domain:
        USER_PROFILE: 1.15
        PROJECT: 1.05
        AGENT: 1.00
        TASK_EPISODIC: 0.80
      evidence:
        explicit: 1.10
        repeated: 1.00
        inferred: 0.90
    promote:                                           # 提升层（memory-v6 §9.3）：L2 → L4 发布候选
      auto: ${MEMORY_PROMOTE_AUTO:false}               # 默认只产候选（发布是显式动作，见 I7）
      min-confidence: ${MEMORY_PROMOTE_MIN_CONFIDENCE:0.8}
      max-per-scan: ${MEMORY_PROMOTE_MAX_PER_SCAN:50}
  heartbeat:                                          # 心跳后台（逐 Agent 各有一套：开关与节拍存在各自那行 heartbeat）
    enabled: ${SUBCONSCIOUS_ENABLED:false}            # 保留字段（心跳改为逐 Agent 后不再用它作全局开关）
    tick-ms: ${SUBCONSCIOUS_TICK_MS:60000}            # 播种某 Agent 心跳行时的默认节拍（毫秒）
    scan-ms: ${SUBCONSCIOUS_SCAN_MS:5000}             # 调度器扫描周期（毫秒）：逐个 Agent 判是否到点
    max-agents-per-beat: ${SUBCONSCIOUS_MAX_AGENTS_PER_BEAT:8} # 单拍派活上限：主会话一拍最多派出几个子代理
    max-tool-rounds: ${SUBCONSCIOUS_MAX_TOOL_ROUNDS:3} # 单个 sub-agent 工具往返上限
    initial-delay-ms: 15000                            # 启动后到第一次心跳扫描的延迟
  # 命令行终端（run_command / list_terminals）：让模型直接控制目标环境。
  # 目标清单（docker 容器 / SSH 服务器与凭证）不在这里，而在库表 term_target，由工作空间页维护；
  # 这里只是全局护栏（超时 / 输出上限）。没有总开关：能不能用只看逐目标的 enabled，
  # 所以新增的工作空间默认关，想让模型用哪台就在页面上开哪台。
  terminal:
    default-timeout-ms: ${TERMINAL_TIMEOUT_MS:60000}  # 单条命令默认超时（毫秒）
    max-timeout-ms: 600000                            # 超时上限（毫秒）：目标自配的值夹取到这里
    max-output-chars: ${TERMINAL_MAX_OUTPUT:20000}    # 回给模型的输出上限（字符，stdout/stderr 各自计）
    max-output-chars-cap: 200000                      # 输出上限的上限（字符）
    audit-keep: 1000                                  # term_command 审计保留条数，超出裁掉最旧的
