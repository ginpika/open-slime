# minis 生产编排：前后端分离两个容器
#   frontend = nginx（托管 Vite 产物 + 反代 /api → backend）
#   backend  = Spring Boot jar（SQLite + LLM，参数来自 backend/.env）
# 用法：
#   cp backend/.env.example backend/.env   # 首次：按需填写 LLM 等参数
#   docker compose up -d --build
#   访问 http://localhost:18081
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: minis-backend:latest
    container_name: minis-backend
    restart: unless-stopped
    # 后端参数全部来自 backend/.env（LLM_API_KEY / SSO 等；真实环境变量优先于该文件）
    env_file:
      - ./backend/.env
    environment:
      # 容器内固定为挂载卷路径，覆盖 .env 里相对 maven 工作目录的默认值
      MINIS_DB_PATH: /data/minis.db
      MINIS_ARTICLE_DIR: /data/article
      MINIS_PORT: "18081"
    volumes:
      # 持久化：SQLite 库 + markdown 文章目录
      - minis-data:/data
      # 若想直接复用仓库 ./data 目录，可改用 bind mount（Windows 上 WAL 可能受文件系统影响，慎用）：
      # - ./data:/data
    # 仅内网可达：由 frontend 反代访问，无需对外暴露端口
    expose:
      - "18081"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: minis-frontend:latest
    container_name: minis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主机端口可用根目录 .env 的 MINIS_HOST_PORT 覆盖
      - "${MINIS_HOST_PORT:-18081}:80"

volumes:
  minis-data:
