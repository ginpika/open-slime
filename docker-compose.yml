# minis 生产编排：前后端分离两个容器
#   frontend = nginx（托管 Vite 产物 + 反代 /api → backend）
#   backend  = Spring Boot jar（SQLite；模型等业务配置在页面维护并存入数据库）
# 用法：
#   cp backend/.env.example backend/.env   # 首次：可保留全注释，部署参数按需覆盖
#   docker compose up -d --build
#   访问 http://localhost:18081
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: slime-backend:latest
    container_name: slime-backend
    restart: unless-stopped
    init: true
    shm_size: '256mb'
    security_opt:
      - seccomp=./backend/browser-seccomp.json
    # 可选部署参数（如 SSO / 代理）；文件可为空，模型等业务配置由页面维护
    env_file:
      - ./backend/.env
    environment:
      # 容器内固定为挂载卷路径，覆盖 .env 里相对 maven 工作目录的默认值
      MINIS_DB_PATH: /data/minis.db
      MINIS_ARTICLE_DIR: /data/article
      MINIS_PORT: "18081"
    volumes:
      # 持久化：SQLite 库 + markdown 文章目录
      - minis-data:/data
      # 若想直接复用仓库 ./data 目录，可改用 bind mount（Windows 上 WAL 可能受文件系统影响，慎用）：
      # - ./data:/data
    # 仅内网可达：由 frontend 反代访问，无需对外暴露端口
    expose:
      - "18081"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: slime-frontend:latest
    container_name: slime-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主机端口可用根目录 .env 的 MINIS_HOST_PORT 覆盖
      - "${MINIS_HOST_PORT:-18081}:80"

volumes:
  minis-data:
