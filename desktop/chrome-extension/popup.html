<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Slime Chrome</title>
<style>body{font:14px system-ui;width:330px;padding:16px;color:#202525}h1{font-size:18px}p{line-height:1.6}textarea{box-sizing:border-box;width:100%;height:80px;margin:8px 0}button{padding:8px 12px;margin:4px 6px 4px 0}#status{overflow-wrap:anywhere}</style>
<h1>连接本机 Slime</h1><p>在桌面端「工作空间 → Chrome」生成连接地址，粘贴到这里。登录状态留在浏览器中，工具只操作独立后台标签页。</p>
<label>连接地址<textarea id="url" spellcheck="false"></textarea></label>
<button id="connect">连接</button><button id="disconnect">断开</button><p id="status" role="status"></p>
<script type="module" src="popup.js"></script></html>
