[package]
name = "minis-desktop"
version = "0.1.0"
edition = "2021"
description = "minis 桌面壳（本机 / 远程双模式）"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# unstable：单窗口多 webview（Window::add_child）——邮件页作为顶层子 webview 盖在主视图区，
# 既保留引导页外壳，又不走 iframe（跨站 cookie / 第三方限制都不受影响）
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
